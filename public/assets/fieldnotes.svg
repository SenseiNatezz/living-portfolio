<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480"><rect width="720" height="480" fill="#d8e1cb"/><g font-family="Arial,sans-serif"><rect x="55" y="54" width="610" height="386" rx="12" fill="#263e3020"/><rect x="55" y="44" width="610" height="386" rx="10" fill="#fffef8"/><path d="M55 84h610" stroke="#e2e5d9"/><circle cx="76" cy="64" r="3" fill="#c6ccbd"/><circle cx="88" cy="64" r="3" fill="#c6ccbd"/><circle cx="100" cy="64" r="3" fill="#c6ccbd"/><text x="355" y="68" text-anchor="middle" font-size="10" fill="#637267">fieldnotes — a little room to think</text><rect x="55" y="85" width="155" height="345" fill="#eff2e7"/><text x="77" y="118" font-size="17" fill="#35513d">❋ Fieldnotes</text><text x="77" y="162" font-size="11" fill="#60705c">YOUR NOTEBOOK</text><rect x="68" y="179" width="128" height="31" rx="4" fill="#dce6ce"/><text x="80" y="199" font-size="11" fill="#35513d">All the little things</text><text x="80" y="235" font-size="11" fill="#60705c">Weekend wanderings</text><text x="80" y="271" font-size="11" fill="#60705c">Ideas worth keeping</text><text x="245" y="141" font-size="9" fill="#879079">PERSONAL / NOTES</text><text x="245" y="187" font-size="27" fill="#2c4432">All the little things.</text><text x="245" y="216" font-size="11" fill="#88917e">A place for thoughts that need a little space.</text><text x="245" y="265" font-size="12" fill="#5e6e59">Make something useful.</text><text x="245" y="290" font-size="12" fill="#5e6e59">Notice what is already beautiful.</text><text x="245" y="315" font-size="12" fill="#5e6e59">Leave room for the unexpected.</text><path d="M245 349h90" stroke="#96ad7f" stroke-width="2"/></g></svg>