<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waypoint — sample prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6ed;color:#294737;font:16px/1.65 system-ui}main{max-width:720px;margin:60px auto;padding:24px}h1{font-size:40px;letter-spacing:-2px}button,input,textarea{font:inherit;padding:12px;border:1px solid #b4c2ad;border-radius:6px}button{background:#294737;color:white;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b57322;outline-offset:4px}input,textarea{width:100%;background:#fffef8;color:#294737;margin:8px 0}textarea{min-height:200px}article,details,label{display:block;background:#fffef8;padding:18px;margin:12px 0;border:1px solid #d7dfcf;border-radius:8px}label input{width:auto;margin-right:12px}summary{cursor:pointer;min-height:44px}small{color:#63705c}a{color:inherit}header{display:flex;justify-content:space-between}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.row button{background:#f0eadf;color:#684725}button:disabled{opacity:.5}</style><main><header><strong>Waypoint</strong><a href="../">Portfolio ↗</a></header><h1>Find your way forward.</h1><label for="search">Search the support library</label><input type="search" id="search" placeholder="Try network, account, or update"><section id="results" aria-label="Search results"></section><p><small>Sample browser prototype. Data stays on this device. Download this HTML file to inspect or adapt its complete source.</small></p><p id="status" role="status"></p></main><script>const articles=[['Connect to Wi-Fi','Open your device network settings, select your trusted network, and enter its password. If it does not appear, toggle Wi-Fi off and on and check the router.'],['Keep your account secure','Use a unique password for each service and enable multi-factor authentication. Save recovery codes in a safe location.'],['Update your workspace','Save your work before opening system settings. Check for updates, review the installation details, and restart when prompted.'],['Troubleshoot a slow browser','Close unused tabs, check extensions, and restart your browser. Test another trusted website to check whether the issue affects all pages.']];function render(){const query=document.querySelector('#search').value.toLowerCase(),results=articles.filter(a=>a.join(' ').toLowerCase().includes(query)),root=document.querySelector('#results');root.replaceChildren();results.forEach(a=>{const d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('p');s.textContent=a[0];p.textContent=a[1];d.append(s,p);root.append(d)});document.querySelector('#status').textContent=results.length?results.length+' articles found.':'No matches. Try a different keyword.'}document.querySelector('#search').oninput=render;render();</script></html>
