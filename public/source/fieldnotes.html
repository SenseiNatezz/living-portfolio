<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldnotes — sample prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6ed;color:#294737;font:16px/1.65 system-ui}main{max-width:720px;margin:60px auto;padding:24px}h1{font-size:40px;letter-spacing:-2px}button,input,textarea{font:inherit;padding:12px;border:1px solid #b4c2ad;border-radius:6px}button{background:#294737;color:white;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b57322;outline-offset:4px}input,textarea{width:100%;background:#fffef8;color:#294737;margin:8px 0}textarea{min-height:200px}article,details,label{display:block;background:#fffef8;padding:18px;margin:12px 0;border:1px solid #d7dfcf;border-radius:8px}label input{width:auto;margin-right:12px}summary{cursor:pointer;min-height:44px}small{color:#63705c}a{color:inherit}header{display:flex;justify-content:space-between}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.row button{background:#f0eadf;color:#684725}button:disabled{opacity:.5}</style><main><header><strong>Fieldnotes</strong><a href="../">Portfolio ↗</a></header><h1>A little room to think.</h1><p>Keep a thought before it wanders away.</p><form id="form"><label for="title">Note title</label><input id="title" required maxlength="100" placeholder="A good idea"><label for="note">Your note</label><textarea id="note" required placeholder="Start anywhere…"></textarea><button>Save note</button></form><section id="notes" aria-label="Saved notes"></section><p><small>Sample browser prototype. Data stays on this device. Download this HTML file to inspect or adapt its complete source.</small></p><p id="status" role="status"></p></main><script>let notes=[];try{notes=JSON.parse(localStorage.getItem('fieldnotes')||'[]')}catch{}const list=document.querySelector('#notes');function save(){try{localStorage.setItem('fieldnotes',JSON.stringify(notes))}catch{document.querySelector('#status').textContent='Storage is unavailable. Notes will last for this visit only.'}}function render(){list.replaceChildren();notes.forEach((n,i)=>{const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),b=document.createElement('button');h.textContent=n.title;p.textContent=n.text;b.textContent='Delete note';b.onclick=()=>{notes.splice(i,1);save();render()};a.append(h,p,b);list.append(a)})}document.querySelector('#form').onsubmit=e=>{e.preventDefault();notes.unshift({title:document.querySelector('#title').value,text:document.querySelector('#note').value});save();render();e.target.reset();document.querySelector('#status').textContent='Note saved.'};render();</script></html>
