<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canopy — sample prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6ed;color:#294737;font:16px/1.65 system-ui}main{max-width:720px;margin:60px auto;padding:24px}h1{font-size:40px;letter-spacing:-2px}button,input,textarea{font:inherit;padding:12px;border:1px solid #b4c2ad;border-radius:6px}button{background:#294737;color:white;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b57322;outline-offset:4px}input,textarea{width:100%;background:#fffef8;color:#294737;margin:8px 0}textarea{min-height:200px}article,details,label{display:block;background:#fffef8;padding:18px;margin:12px 0;border:1px solid #d7dfcf;border-radius:8px}label input{width:auto;margin-right:12px}summary{cursor:pointer;min-height:44px}small{color:#63705c}a{color:inherit}header{display:flex;justify-content:space-between}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.row button{background:#f0eadf;color:#684725}button:disabled{opacity:.5}</style><main><header><strong>Canopy</strong><a href="../">Portfolio ↗</a></header><h1>Small steps. Real growth.</h1><p>One day at a time. Your progress resets with a new local day.</p><h2 id="progress" aria-live="polite"></h2><section id="habits"></section><p><small>Sample browser prototype. Data stays on this device. Download this HTML file to inspect or adapt its complete source.</small></p><p id="status" role="status"></p></main><script>const key='canopy-'+new Date().toLocaleDateString();let done=[];try{done=JSON.parse(localStorage.getItem(key)||'[]')}catch{}const habits=['Get outside for a walk','Read a few pages','Make time to create'];function update(){document.querySelector('#progress').textContent=done.length+' / 3 habits completed';try{localStorage.setItem(key,JSON.stringify(done))}catch{document.querySelector('#status').textContent='Progress is available for this visit only.'}}habits.forEach((h,i)=>{const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=done.includes(i);input.onchange=()=>{done=input.checked?[...done,i]:done.filter(n=>n!==i);update()};label.append(input,document.createTextNode(h));document.querySelector('#habits').append(label)});update();</script></html>
